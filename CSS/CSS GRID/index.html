<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 10px;
            padding: 10px;
        }
        #box{
            border: 2px solid black;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>CSS GRID PROPERTIES</h1>
    <div class="container">
        <div id="box">1</div>
        <div id="box">2</div>
        <div id="box">3</div>
        <div id="box">4</div>
        <div id="box">5</div>
        <div id="box">6</div>
    </div>
</body>
</html>
