<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1::after{
            content: " Ram";
            color: red;
        }
        h1::before{
            color: darkorange;
            content: "Jai ";
        }
        h1::first-letter{
            font-size: 50px;
        }
        p::first-line{
            color: pink;
        }
        p::selection{
            color: blueviolet;
            background-color: black;
        }
        li::marker{
            font-weight: bold;
            color: darkorange;
        }
    </style>
</head>
<body>
    <h1>Shree</h1>
    <h2>Pray</h2>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Hic nostrum deserunt vitae ipsa illo, possimus deleniti fuga ut fugiat eligendi voluptatum modi necessitatibus quis enim odit dicta excepturi nulla. Officia!</p>

    <ol>
       <LI>HTML</LI>
       <LI>CSS</LI>
       <LI>JS</LI>
       <LI>REACT</LI>
    </ol>
</body>
</html>
