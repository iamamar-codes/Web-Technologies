<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #b1:hover{
            font-size: larger;
            color: white;
            background-color: black; 
            cursor: pointer;
        }
        #b2:active{
            background-color: chartreuse;
        }
        #b3:disabled{
            
        }
        input:focus{
            background-color: gold;
            color: white;
        }
        li:first-child{
            color: blue;
        }
        li:last-child{
            color: coral;
        }
        li:nth-child(2){
            color: darkblue;
        }
        li:nth-child(3){
            color: brown;
        }
    </style>
</head>
<body>
    <button id="b1">Hover</button>
    <button id="b2">Active</button>
    <br>
    <br>
    Name: <input type="text" placeholder="Enter Your Name">
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>

    </ul>
    <button id="b3" disabled>Disabled</button>
</body>
</html>
