<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            border: 2px solid royalblue;
            align-items: center;
            line-height: 100px;
            margin: 20px;
            transition: 1s;

        }
        .box1:hover{
            transform: scale(1.5);
        }
        .box2:hover{
            transform: scaleX(2);
        }.box3:hover{
            transform: scaleY(2);
        }.box4:hover{
            transform: scale3D(1.5,2,2);
        }
    </style>
</head>
<body>
    <h1>Scale</h1>
    <div class="box box1">Scale1</div>
    <div class="box box2">Scale2</div>
    <div class="box box3">Scale3</div>
    <div class="box box4">Scale4</div>
</body>
</html>
