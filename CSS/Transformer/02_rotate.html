<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            border: 2px solid royalblue;
            align-items: center;
            line-height: 100px;
            margin: 20px;
            transition: 1s;
        }
        .box1:hover{
            transform: rotate(60deg);
        }
        .box2:hover{
            transform: rotatex(180deg);
        }.box3:hover{
            transform: rotate(180deg);
        }.box4:hover{
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <h1>Translate</h1>
    <div class="box box1">Rotate</div>
    <div class="box box2">RotateX</div>
    <div class="box box3">RotateY</div>
    <div class="box box4">RotateZ</div>
</body>
</html>
