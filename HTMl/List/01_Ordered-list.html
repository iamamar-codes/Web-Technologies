<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol>
        <li>Amar</li>
        <li>Aman</li>
        <li>Atul</li>
        <li>Sahil</li>
        <li>Peter</li>

    </ol>
    <br>
     <ol type="A">
        <li>Amar</li>
        <li>Aman</li>
        <li>Atul</li>
        <li>Sahil</li>
        <li>Peter</li>

    </ol>
    <br>
     <ol type="A" reversed>
        <li>Amar</li>
        <li>Aman</li>
        <li>Atul</li>
        <li>Sahil</li>
        <li>Peter</li>

    </ol>
     <ol type="1" start="3">
        <li>Amar</li>
        <li>Aman</li>
        <li>Atul</li>
        <li>Sahil</li>
        <li>Peter</li>

    </ol>
</body>
</html>
