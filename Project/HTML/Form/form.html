<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp form</title>
    <link rel="stylesheet" href="form.css">
  </head>
  <body>
    <center>
      <fieldset>
        <legend align="center"><h1>Sign Up</h1></legend>
        <form action="" method="get">
          <table cellpadding="3" cellspacing="5">
            <tr>
              <td><label for="fname">First Name:</label></td>
              <td>
                <input type="text" id="fname" placeholder="Tony" name="firstname" />
              </td>
            </tr>
            <tr>
              <td><label for="lname">Last Name:</label></td>
              <td>
                <input type="text" id="lname" placeholder="Stark" name="lastname" />
              </td>
            </tr>
            <tr>
              <td><label for="mail">Email:</label></td>
              <td>
                <input type="email" id="mail" placeholder="example@123" name="email" />
              </td>
            </tr>
            <tr>
              <td><label for="mobileN">Mobile Number:</label></td>
              <td>
                <input type="tell" id="mobileN" placeholder="1234567890" name="number" />
              </td>
            </tr>
            <tr>
              <td><label for="pass">Password:</label></td>
              <td>
                <input type="password" id="pass" placeholder="" name="firstname"name="pass" />
              </td>
            </tr>
            <tr>
              <td><label for="Cpass">Conform Password:</label></td>
              <td>
                <input type="password" id="Cpass" placeholder="" name="firstname" name="conform" />
              </td>
            </tr>
          </table>
          <button type="submit">Sign Up</button>
          <button type="reset">Cancel</button>
        </form>
      </fieldset>
    </center>
  </body>
</html>
