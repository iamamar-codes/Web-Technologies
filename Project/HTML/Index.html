<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
</head>

<body>
    <center>
        <form>
            <fieldset>
                <legend>
                    <h1>Sign up</h1>
                </legend <table>
                <tr>
                    <td>FullName</td>
                    <td>
                        <input type="text" maxlength="20">
                    </td>
                </tr>
                <br><br>
                <tr>
                    <td>Lastname</td>
                    <td>
                        <input type="text" maxlength="20">
                    </td>
                </tr>
                <br><br>
                <tr>
                    <td>Username: </td>
                    <td><input type="text" maxlength="10"></td>
                </tr>
                <br><br><tr>
                    <td>Password: </td>
                    <td><input type="password" maxlength="10"></td>
                </tr>
                <br><br>
                <tr>
                    <td>Mobile No: </td>
                    <td><input type="tel" maxlength="10"></td>
                </tr>
                <br><br>
                <tr>
                    <td>Email ID: </td>
                    <td><input type="email"></td>
                </tr>
                <br><br>
                <a href="./Login.html" target="_blank">
                    <button type="submit">Create</button> 
                </a>
                <button>Cancel</button>
            </fieldset>
        </form>
    </center>
</body>

</html>
