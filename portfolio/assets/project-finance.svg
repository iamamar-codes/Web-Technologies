<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#365314"/><stop offset=".55" stop-color="#052e16"/><stop offset="1" stop-color="#03120a"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#bef264"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="110" cy="70" r="150" fill="#22c55e" opacity=".1"/>

  <!-- terminal window -->
  <rect x="60" y="48" width="680" height="354" rx="16" fill="#040b07" stroke="#6ee7b7" stroke-opacity=".3"/>
  <rect x="60" y="48" width="680" height="42" rx="16" fill="#0d2217"/>
  <rect x="60" y="74" width="680" height="16" fill="#0d2217"/>
  <circle cx="84" cy="69" r="6" fill="#22c55e"/><circle cx="104" cy="69" r="6" fill="#166534"/><circle cx="124" cy="69" r="6" fill="#166534"/>
  <text x="400" y="74" font-size="13" text-anchor="middle" fill="#9bb5a8">finance_tracker.py — python</text>

  <g font-size="16">
    <text x="88" y="126" fill="#bef264">$ <tspan fill="#ecfdf5">python finance_tracker.py</tspan></text>
    <text x="88" y="158" fill="#6ee7b7">======== FINANCE TRACKER ========</text>
    <text x="88" y="184" fill="#9bb5a8">1. Add Income    2. Add Expense</text>
    <text x="88" y="208" fill="#9bb5a8">3. View Balance  4. Exit</text>
    <text x="88" y="240" fill="#bef264">&gt; <tspan fill="#ecfdf5">3</tspan></text>
    <text x="88" y="276" fill="#ecfdf5">Income    : <tspan fill="#6ee7b7">Rs 25,000</tspan></text>
    <text x="88" y="302" fill="#ecfdf5">Expenses  : <tspan fill="#fcd34d">Rs 11,450</tspan></text>
    <text x="88" y="328" fill="#ecfdf5">---------------------</text>
    <text x="88" y="354" fill="#ecfdf5" font-weight="700">Balance   : <tspan fill="#22c55e">Rs 13,550</tspan></text>
    <rect x="88" y="368" width="10" height="18" fill="#22c55e"/>
  </g>

  <!-- mini chart -->
  <g>
    <rect x="470" y="120" width="238" height="250" rx="12" fill="#0d2217" stroke="#6ee7b7" stroke-opacity=".2"/>
    <text x="488" y="148" font-size="12" fill="#9bb5a8">class Account:  # monthly</text>
    <line x1="488" y1="336" x2="690" y2="336" stroke="#6ee7b7" stroke-opacity=".3"/>
    <rect x="496" y="262" width="24" height="74" rx="4" fill="url(#g)"/>
    <rect x="530" y="232" width="24" height="104" rx="4" fill="url(#g)"/>
    <rect x="564" y="250" width="24" height="86" rx="4" fill="url(#g)"/>
    <rect x="598" y="204" width="24" height="132" rx="4" fill="url(#g)"/>
    <rect x="632" y="222" width="24" height="114" rx="4" fill="url(#g)"/>
    <rect x="666" y="178" width="24" height="158" rx="4" fill="url(#g)"/>
    <polyline points="508,252 542,222 576,240 610,194 644,212 678,168" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="678" cy="168" r="5" fill="#fcd34d"/>
    <text x="488" y="358" font-size="11" fill="#9bb5a8">Jan  Feb  Mar  Apr  May  Jun</text>
